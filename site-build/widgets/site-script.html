<script>(function(){var d=document.documentElement,k='bc_consent',s=null;try{s=localStorage.getItem(k)}catch(e){}if(!s)d.classList.add('bc-ask');if(location.hash==='#bayimiz-ol')d.classList.add('bc-modal-open');function save(v){try{localStorage.setItem(k,JSON.stringify(v))}catch(x){}d.classList.remove('bc-ask')}function close(){d.classList.remove('bc-modal-open')}document.addEventListener('click',function(e){var t=e.target;if(t.closest('.bc-bayi')&&document.getElementById('bc-modal')){e.preventDefault();d.classList.add('bc-modal-open');var f=document.querySelector('#bc-modal input[type=text]');if(f)setTimeout(function(){f.focus()},200);return}if(t.closest('#bc-modal [data-close]')){close();return}var b=t.closest('.bc-cookie button');if(!b)return;var c=b.closest('.bc-cookie');if(b.dataset.consent==='all')save({analytics:true,marketing:true});else if(b.dataset.consent==='necessary')save({analytics:false,marketing:false});else if(b.dataset.prefs){if(!c.classList.contains('open')){c.classList.add('open');b.textContent='SEÇİMİ KAYDET'}else save({analytics:c.querySelector('[name=analytics]').checked,marketing:c.querySelector('[name=marketing]').checked})}});document.addEventListener('keydown',function(e){if(e.key==='Escape')close()})})();</script>
